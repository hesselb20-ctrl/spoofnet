<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" role="img" aria-label="Data flow: per phone, a raw GNSS log (C/N0, AGC, clock, pseudoranges) from GnssLogger or the simulator is turned into features against a per-signal baseline, and a fitted detector raises jamming, spoofing or meaconing events. Each event goes up as a type, score and coarse cell under a daily token, never a track. The server clusters events from three or more contributors into an incident and locates the source from C/N0 loss with an uncertainty ellipse. Publication rules decide what each audience sees; the API and the MapLibre map serve it, with areas without phones drawn as no data.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#EDEDED}.mute{fill:#8C8C8C}.acc{fill:#FFFFFF}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="464" rx="3" fill="#0A0A0A"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-width="1"/></pattern></defs>
<rect width="800" height="464" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M776 14H786V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M24 450H14V440" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M776 450H786V440" fill="none" stroke="#8C8C8C" stroke-width="1"/>
<text x="36" y="54" class="m" font-size="10.5"><tspan class="acc">A</tspan><tspan class="mute" dx="10">Per phone</tspan></text><line x1="139.8" y1="50" x2="764" y2="50" stroke="#171717"/><rect x="36" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.00s" cx="52" cy="93" r="3" fill="#FFFFFF"/>
<text x="64" y="97" class="m ink" font-size="11" font-weight="600">Raw log</text>
<text x="52" y="119" class="s mute" font-size="12">C/N0, AGC, clock, pseudoranges</text>
<text x="52" y="135" class="s mute" font-size="12">GnssLogger text or simulator</text><path class="flow" d="M252 111H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 107l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.45s" cx="308" cy="93" r="3" fill="#FFFFFF"/>
<text x="320" y="97" class="m ink" font-size="11" font-weight="600">Features</text>
<text x="308" y="119" class="s mute" font-size="12">per-signal C/N0 baseline</text>
<text x="308" y="135" class="s mute" font-size="12">AGC, clock, constellations</text><path class="flow" d="M508 111H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 107l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.90s" cx="564" cy="93" r="3" fill="#FFFFFF"/>
<text x="576" y="97" class="m ink" font-size="11" font-weight="600">Detector</text>
<text x="564" y="119" class="s mute" font-size="12">fitted logistic score</text>
<text x="564" y="135" class="s mute" font-size="12">jam, spoof, meacon events</text><path class="flow" d="M656 150V172H226V207" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M222 206l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="36" y="194" class="m" font-size="10.5"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Upload and server</tspan></text><line x1="205.39999999999998" y1="190" x2="764" y2="190" stroke="#171717"/><rect x="36" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.35s" cx="52" cy="233" r="3" fill="#FFFFFF"/>
<text x="64" y="237" class="m ink" font-size="11" font-weight="600">Event</text>
<text x="52" y="259" class="s mute" font-size="12">type, score, coarse cell</text>
<text x="52" y="275" class="s mute" font-size="12">daily token, no track</text><path class="flow" d="M252 251H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 247l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.80s" cx="308" cy="233" r="3" fill="#FFFFFF"/>
<text x="320" y="237" class="m ink" font-size="11" font-weight="600">Incident</text>
<text x="308" y="259" class="s mute" font-size="12">3+ contributors, near in time</text>
<text x="308" y="275" class="s mute" font-size="12">type by weighted vote</text><path class="flow" d="M508 251H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 247l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.25s" cx="564" cy="233" r="3" fill="#FFFFFF"/>
<text x="576" y="237" class="m ink" font-size="11" font-weight="600">Locate</text>
<text x="564" y="259" class="s mute" font-size="12">C/N0 loss against distance</text>
<text x="564" y="275" class="s mute" font-size="12">source + 95% ellipse</text><path class="flow" d="M656 290V312H226V347" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M222 346l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="36" y="334" class="m" font-size="10.5"><tspan class="acc">C</tspan><tspan class="mute" dx="10">Publication</tspan></text><line x1="156.2" y1="330" x2="764" y2="330" stroke="#171717"/><rect x="36" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.70s" cx="52" cy="373" r="3" fill="#FFFFFF"/>
<text x="64" y="377" class="m ink" font-size="11" font-weight="600">Rules</text>
<text x="52" y="399" class="s mute" font-size="12">public: coarse, k = 3, delayed</text>
<text x="52" y="415" class="s mute" font-size="12">source only for vetted users</text><path class="flow" d="M252 391H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 387l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.15s" cx="308" cy="373" r="3" fill="#FFFFFF"/>
<text x="320" y="377" class="m ink" font-size="11" font-weight="600">API</text>
<text x="308" y="399" class="s mute" font-size="12">FastAPI, SQLite</text>
<text x="308" y="415" class="s mute" font-size="12">public, customer, vetted</text><path class="flow" d="M508 391H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 387l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.60s" cx="564" cy="373" r="3" fill="#FFFFFF"/>
<text x="576" y="377" class="m ink" font-size="11" font-weight="600">Map</text>
<text x="564" y="399" class="s mute" font-size="12">MapLibre, hourly coverage</text>
<text x="564" y="415" class="s mute" font-size="12">no phones drawn as no data</text>
</svg>